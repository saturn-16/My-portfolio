<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="pineGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a3f31"/>
      <stop offset="100%" stop-color="#04251b"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#pineGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#165c47" stroke-width="4" stroke-opacity="0.4" />

  <!-- Monogram Group -->
  <g transform="translate(18, 0)">
    <!-- G Outer Ring -->
    <path d="M 230 145 C 150 145 95 200 95 280 C 95 360 150 415 230 415 C 290 415 330 380 345 330 L 290 330 C 275 355 255 370 230 370 C 175 370 140 330 140 280 C 140 230 175 190 230 190 C 265 190 290 205 310 230 L 350 195 C 320 160 280 145 230 145 Z" fill="#efebe4" />

    <!-- G Neon Accent Inner Arc -->
    <path d="M 230 215 C 190 215 165 242 165 280 C 165 318 190 345 230 345 C 255 345 272 335 280 320" fill="none" stroke="#00d182" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" opacity="0.9" />

    <!-- G Crossbar -->
    <rect x="230" y="260" width="85" height="40" fill="#efebe4" rx="4" />

    <!-- Vertical Divider Line (Neon Emerald Accent) -->
    <rect x="330" y="145" width="12" height="270" fill="#00d182" rx="6" filter="url(#neonGlow)" />

    <!-- K Vertical Stem -->
    <rect x="350" y="145" width="40" height="270" fill="#efebe4" rx="4" />

    <!-- K Upper Diagonal -->
    <path d="M 390 285 L 485 160 L 430 160 L 365 255 Z" fill="#efebe4" />

    <!-- K Lower Diagonal -->
    <path d="M 375 255 L 485 415 L 430 415 L 345 295 Z" fill="#efebe4" />
  </g>
</svg>
